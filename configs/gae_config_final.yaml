in_channels: 3
latent_dim: 15
learning_rate: 0.01
max_nodes: 15

# Dense layer
dense_use_norm: true
dense_activation: "silu" # relu, gelu, elu, tanh, none, leaky_relu. silu
dense_dropout_rate: 0.0

# Conv Layer
conv_use_norm: true
conv_activation: "silu" # relu, gelu, elu, tanh, none, leaky_relu. silu
conv_dropout_rate: 0.0
conv_type: "dense_graph_conv" # dense_gcn_conv ,dense_sage_conv, dense_graph_conv, dense_gin_conv

# Encoder
encoder_use_mlp: true
encoder_mlp_out_features: 32


# Decoder A
decoder_mlp_out_features: 15

joint_threshold: 0.5
pos_weight: 2.0
weight_a: 10.0
kl_weight: 0.001

use_accumulator: false
batch_size: 256
max_epochs: 100
supp_training_epochs: 16

locality_loss_type: "fitness" # 'fitness', 'parts_num' , 'similarity'
locality_loss_method: "spearman" # 'pearson', 'spearman'
locality_loss_lambda_val: 0.2
save_dir: "./checkpoints"