in_channels: 3
latent_dim: 15
learning_rate: 0.004
max_nodes: 15

# Dense layer
dense_use_norm: true
dense_activation: "silu" # relu, gelu, elu, tanh, none, leaky_relu. silu
dense_dropout_rate: 0.0

# Conv Layer
conv_use_norm: true
conv_activation: "silu" # relu, gelu, elu, tanh, none, leaky_relu. silu
conv_dropout_rate: 0.0
conv_type: "dense_graph_conv" # dense_gcn_conv ,dense_sage_conv, dense_graph_conv, dense_gin_conv

# Encoder
encoder_use_mlp: true
encoder_mlp_out_features: 32


# Decoder A
decoder_mlp_out_features: 15


encoder_conv_channels:
  - 128
  - 256

# Płytki lejek - tylko 2 szybkie przejścia
encoder_dense_features:
  - 512
  - 128

# --- DEKODER A (Topologia) ---
# Szybkie rozpakowanie
decoder_a_hidden_dims:
  - 128
  - 256

# --- DEKODER X (Geometria 3D) ---
decoder_x_dense_features:
  - 128
  - 256

decoder_x_conv_channels:
  - 128

decoder_x_initial_channels: 128

pos_weight: 2.0
weight_a: 0.1
kl_weight: 0.00001

use_accumulator: false
batch_size: 256
max_epochs: 200

count_valid: true # Czy to istnieje?


locality_loss_type: "fitness" # 'fitness', 'parts_num' , 'similarity'
locality_loss_method: "spearman" # 'pearson', 'spearman'
locality_loss_lambda_val: 0.002
save_dir: "./checkpoints"